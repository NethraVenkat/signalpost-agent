[build-system]
requires = ["hatchling==1.29.0"]
build-backend = "hatchling.build"

[project]
name = "signalpost-agent"
version = "1.1.0"
requires-python = ">=3.12"
dependencies = ["httpx>=0.28,<1", "pydantic>=2.12,<3", "tldextract>=5.3,<6"]

[project.scripts]
signalpost = "signalpost.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10", "respx>=0.22,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/signalpost"]
